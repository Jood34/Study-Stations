<!DOCTYPE html>
<html dir="rtl" lang="ar" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Stations 🚉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFE9D8; --card:#FBF7EC; --border:#E4DCC6; --track:#ECE5D2;
    --text:#23342F; --muted:#8b8677; --muted-icon:#B9B3A4;
    --primary:#1F5C54; --gold:#E4A93B; --green:#6FA287; --red:#C4593F;
    --blue:#4F86B0; --purple:#9B7FC7; --rose:#D8607A; --yellow:#E3C23C; --gray-light:#B7BDC6;
    --zebra:#00000008;
  }
  [data-theme="dark"]{
    --bg:#181F1D; --card:#212B27; --border:#354039; --track:#26312C;
    --text:#EAE6D9; --muted:#A6A08E; --muted-icon:#6E7871; --zebra:#ffffff08;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;}
  .font-d{font-family:'Cairo',sans-serif;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--muted-icon);border-radius:3px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;color:var(--text);}
  input[type=color]{padding:0;border:1px solid var(--border);border-radius:10px;width:44px;height:38px;background:var(--card);}
  input[type=date],input[type=time]{color-scheme: light;}
  [data-theme="dark"] input[type=date],[data-theme="dark"] input[type=time]{color-scheme: dark;}

  .shell{display:flex;min-height:100vh;}
  .sidebar{width:210px;flex-shrink:0;background:var(--card);border-left:1px solid var(--border);
    display:flex;flex-direction:column;padding:14px 10px;position:fixed;top:0;right:0;height:100vh;overflow-y:auto;
    transform:translateX(100%);transition:transform .25s ease;z-index:41;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{position:fixed;inset:0;background:#00000055;z-index:40;}
  .hamburger{font-size:19px;padding:4px;border-radius:8px;}
  .hamburger:hover{background:var(--track);}
  @media(min-width:900px){
    .sidebar{position:sticky;transform:none !important;}
    .shell{padding-right:0;}
  }
  @media(max-width:899px){ .shell{padding-right:0;} }
  .side-logo{display:flex;align-items:center;gap:8px;padding:6px 8px 16px;}
  .side-logo .box{background:var(--primary);color:#fff;border-radius:12px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .side-logo b{font-size:14px;}
  .side-logo span{display:block;font-size:10px;color:var(--muted);}
  .nav-item{display:flex;align-items:center;gap:9px;padding:10px 10px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:3px;transition:.15s;color:var(--muted);text-align:right;width:100%;}
  .nav-item.active{background:color-mix(in srgb, var(--primary) 15%, transparent);color:var(--primary);}
  .nav-item:hover{background:var(--track);}
  .nav-item .ic{font-size:17px;width:20px;text-align:center;flex-shrink:0;}
  .side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px;}

  .content{flex:1;min-width:0;padding-bottom:40px;}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
  .topbar h1{font-size:16px;margin:0;}
  .main{padding:16px 18px;max-width:1000px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:16px;}
  .card.hl{border-color:var(--gold);}
  .grid{display:grid;gap:10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .muted{color:var(--muted);}
  .muted-i{color:var(--muted-icon);}
  .btn{background:var(--primary);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
  .btn:disabled{opacity:.5;}
  .btn.outline{background:transparent;border:2px dashed color-mix(in srgb, var(--primary) 40%, transparent);color:var(--primary);}
  .btn.ghost{background:var(--track);color:var(--text);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn.sm{padding:6px 10px;font-size:11px;border-radius:20px;}
  .pill{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .bar{height:7px;border-radius:6px;background:var(--track);overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:6px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;padding:0 2px;gap:8px;flex-wrap:wrap;}
  .section-title h2{font-size:15px;margin:0;display:flex;align-items:center;gap:6px;}
  .field label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:9px 11px;font-size:13px;}
  .field textarea{resize:none;}
  .field{margin-bottom:11px;}
  .two-col{display:flex;gap:8px;}
  .two-col > .field{flex:1;}
  .empty{text-align:center;padding:34px 10px;color:var(--muted-icon);}
  .empty .em{font-size:30px;margin-bottom:8px;}
  .empty .t{color:var(--muted);font-size:13px;font-weight:600;}
  .empty .s{font-size:12px;margin-top:4px;}

  .overlay{position:fixed;inset:0;background:#00000055;display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:var(--card);width:100%;max-width:420px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px;}
  @media(min-width:640px){.modal{border-radius:24px;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h3{margin:0;font-size:15px;}
  .close-x{color:var(--muted-icon);font-size:18px;}

  .toggle{width:42px;height:24px;border-radius:20px;position:relative;background:var(--border);flex-shrink:0;}
  .toggle.on{background:var(--primary);}
  .toggle i{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:.15s;}
  .toggle.on i{right:2px;}
  .toggle:not(.on) i{right:20px;}

  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;flex-shrink:0;}
  .swatch.sel{border-color:var(--text);}

  .seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:3px;gap:2px;}
  .seg button{flex:1;padding:8px;border-radius:12px;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;}
  .seg button.on{background:var(--primary);color:#fff;}

  .choice{border:2px solid var(--border);border-radius:14px;padding:10px;text-align:center;font-size:12px;font-weight:700;flex:1;}
  .choice.on{border-color:var(--primary);background:color-mix(in srgb, var(--primary) 10%, transparent);color:var(--primary);}

  .emoji-grid{max-height:130px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px;padding:4px;border:1px solid var(--border);border-radius:14px;margin-bottom:12px;}
  .emoji-grid button{font-size:17px;width:30px;height:30px;border-radius:8px;}
  .emoji-grid button:hover{background:var(--track);}

  /* timetable grid */
  .tt-wrap{overflow-x:auto;}
  .tt-grid{display:grid;min-width:560px;}
  .tt-head{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:8px 4px;border-bottom:2px solid var(--border);}
  .tt-col{position:relative;border-left:1px solid var(--border);}
  .tt-col.zebra{background:var(--zebra);}
  .tt-hourline{position:absolute;right:0;left:0;border-top:1px solid var(--border);font-size:0;}
  .tt-timelabel{font-size:10px;color:var(--muted);display:flex;align-items:flex-start;justify-content:center;padding-top:2px;}
  .tt-block{position:absolute;left:3px;right:3px;border-radius:12px;border:1.5px solid; padding:5px 6px;overflow:hidden;text-align:center;}
  .tt-block b{font-size:10.5px;display:block;}
  .tt-block span{font-size:9px;display:block;opacity:.85;}
  .tt-addrow{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;}
  .tt-addbtn{flex-shrink:0;font-size:10px;font-weight:800;color:var(--primary);background:var(--track);border-radius:20px;padding:7px 12px;white-space:nowrap;}

  /* month calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:9px;font-weight:800;color:var(--muted);padding-bottom:4px;}
  .cal-cell{aspect-ratio:1;border-radius:12px;background:var(--track);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;}
  .cal-cell.today{background:color-mix(in srgb, var(--primary) 18%, transparent);border:1.5px solid var(--primary);}
  .cal-dots{display:flex;gap:2px;}
  .cal-dots i{width:5px;height:5px;border-radius:50%;display:block;}

  /* weeks static list */
  .week-card{width:100%;text-align:right;}

  /* review row */
  .rev-check{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
  .rev-check.done{background:var(--green);border-color:var(--green);color:#fff;}

  a{color:inherit;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================= DATA & CONSTANTS ======================= */
const STORAGE_KEY = "study-stations-v3";
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const addDays = (s,n) => { const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return toDateStr(d); };
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
const WEEKDAYS_AR = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS_AR = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const HIJRI_MONTHS = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const humanDate = s => { const d=new Date(s+"T00:00:00"); return `${WEEKDAYS_AR[d.getDay()]} ${d.getDate()} ${MONTHS_AR[d.getMonth()]}`; };
const gDay = s => new Date(s+"T00:00:00").getDate();
const gMonth = s => MONTHS_AR[new Date(s+"T00:00:00").getMonth()];
const gYear = s => new Date(s+"T00:00:00").getFullYear();
const formatRange = (a,b) => {
  const sd=gDay(a), sm=gMonth(a), sy=gYear(a), ed=gDay(b), em=gMonth(b), ey=gYear(b);
  if(a===b) return `${sd} ${sm} ${sy}م`;
  if(sy===ey && sm===em) return `${sd} – ${ed} ${em} ${sy}م`;
  if(sy===ey) return `${sd} ${sm} – ${ed} ${em} ${sy}م`;
  return `${sd} ${sm} ${sy}م – ${ed} ${em} ${ey}م`;
};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Hijri conversion (tabular / "Kuwaiti" algorithm — approximate, ±1 day of official Umm al-Qura) ---- */
function gregorianToJDN(y,m,d){ const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3; return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045; }
function jdnToHijri(jdn){
  let l = jdn - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = Math.floor((10985-l)/5316)*Math.floor((50*l)/17719) + Math.floor(l/5670)*Math.floor((43*l)/15238);
  l = l - Math.floor((30-j)/15)*Math.floor((17719*j)/50) - Math.floor(j/16)*Math.floor((15238*j)/43) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return {year, month, day};
}
function gToH(y,m,d){ const h = jdnToHijri(gregorianToJDN(y,m,d)); return [h.year,h.month,h.day]; }
function hijriHumanDate(dateStr){ const d=new Date(dateStr+"T00:00:00"); const [hy,hm,hd]=gToH(d.getFullYear(),d.getMonth()+1,d.getDate()); return `${WEEKDAYS_AR[d.getDay()]} ${hd} ${HIJRI_MONTHS[hm-1]} ${hy}هـ`; }
function displayDate(dateStr){ return state.dateSystem==="hijri" ? hijriHumanDate(dateStr) : humanDate(dateStr); }

const YEAR_START = "2026-08-23";
const WEEK_ORDINALS = ["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر","العشرون"];
const WEEK_HIJRI = ["10 إلى 16 ربيع الأول 1448هـ","17 إلى 23 ربيع الأول 1448هـ","24 إلى 30 ربيع الأول 1448هـ","1 إلى 7 ربيع الآخر 1448هـ","8 إلى 14 ربيع الآخر 1448هـ","15 إلى 21 ربيع الآخر 1448هـ","22 إلى 28 ربيع الآخر 1448هـ","29 ربيع الآخر إلى 5 جمادى الأولى 1448هـ","6 إلى 12 جمادى الأولى 1448هـ","13 إلى 19 جمادى الأولى 1448هـ","20 إلى 26 جمادى الأولى 1448هـ","27 جمادى الأولى إلى 3 جمادى الآخرة 1448هـ","4 إلى 10 جمادى الآخرة 1448هـ","11 إلى 17 جمادى الآخرة 1448هـ","18 إلى 24 جمادى الآخرة 1448هـ","25 جمادى الآخرة إلى 1 رجب 1448هـ","2 إلى 8 رجب 1448هـ","9 إلى 15 رجب 1448هـ","16 إلى 22 رجب 1448هـ","23 إلى 29 رجب 1448هـ"];
const WEEKS = WEEK_ORDINALS.map((ordinal,i)=>{ const start=addDays(YEAR_START,i*7); const end=addDays(start,6); return {number:i+1,ordinal,start,end,hijri:WEEK_HIJRI[i]}; });
const KEY_DATES = [
  {id:"term-start",type:"occasion",emoji:"🎓",title:"بداية العام الدراسي",start:"2026-08-23",end:"2026-08-23"},
  {id:"national-day",type:"holiday",emoji:"🇸🇦",title:"إجازة اليوم الوطني",start:"2026-09-23",end:"2026-09-26"},
  {id:"autumn-break",type:"holiday",emoji:"🍂",title:"إجازة الخريف",start:"2026-11-20",end:"2026-11-28"},
  {id:"mid-year-break",type:"holiday",emoji:"❄️",title:"إجازة منتصف العام الدراسي",start:"2027-01-08",end:"2027-01-16"},
];
const EVENT_COLORS = {
  occasion:{v:"--rose",label:"🎗️ مناسبات"}, holiday:{v:"--yellow",label:"🏖️ إجازات"},
  test:{v:"--purple",label:"🏁 اختبارات"}, lecture:{v:"--blue",label:"📘 محاضرات"},
  task:{v:"--green",label:"✅ مهام"}, reminder:{v:"--yellow",label:"🔔 تذكيرات"},
  other:{v:"--gray-light",label:"⚪ أخرى"}, station:{v:"--primary",label:"🚉 محطة جديدة"},
};
const REVIEW_OFFSETS = [1,3,7,14,30];
const DEFAULT_TASKS = ["قراءة السلايدات","فهم المحتوى","كتابة الملاحظات","تلخيص Chapter","حل الأسئلة"];
const EMOJI_LIST = ["📘","📗","📕","📙","📖","📔","📒","📓","✏️","🖊️","📝","🗂️","📁","🧾",
  "🧪","🔬","🧫","🧬","💊","🩺","🩻","🦴","🧠","❤️","🫀","🫁","👁️","🦷",
  "📐","📏","🧮","➕","➗","🧲","⚛️","🌍","🌎","🌏","🗺️","🧭",
  "🏛️","⚖️","💼","📊","📈","📉","💻","⌨️","🖥️","🛰️","🔭",
  "🔧","⚙️","🛠️","🎨","🎭","🎼","🎻","🎹","🎵",
  "🧑‍⚖️","🧑‍🔬","🧑‍⚕️","🧑‍🏫","🧑‍💻","🌱","🧴","🧵","🏗️","🚀","✈️","🏦","💰","🗣️","🌐","🧩","🕌","📜"];
const COLOR_PRESETS = ["#C9A6B0","#9FB8CE","#A9C4A0","#E3C99A","#B9A6D6","#C4BFA8","#E0B6A3","#8FBFB0"];
const GRADE_SCALE = {"A+":5.00,"A":4.75,"B+":4.50,"B":4.00,"B-":3.50,"C+":3.00,"C":2.50,"C-":2.00,"D+":1.50,"D":1.00,"F":0.00};
const EVENT_TYPE_OPTIONS = [["occasion","🎗️ مناسبة"],["holiday","🏖️ إجازة"],["test","🏁 اختبار"],["lecture","📘 محاضرة"],["task","✅ مهمة"],["reminder","🔔 تذكير"],["other","⚪ أخرى"]];

/* ======================= STATE ======================= */
const defaultState = () => ({ subjects:[], weeklyLog:{}, timetable:{}, gpaCourses:[], customEvents:[], todos:[], darkMode:false, timeFormat:"24", dateSystem:"gregorian" });
let state = defaultState();
let ui = { view:"home", subjectDetailId:null, weekDetailNumber:null, calMode:"month", modal:null, sidebarOpen:false };
function isMobile(){ return window.innerWidth < 900; }
function toggleSidebar(){ ui.sidebarOpen = !ui.sidebarOpen; render(); }
function closeSidebar(){ ui.sidebarOpen = false; render(); }
let calCursor = { y: new Date().getFullYear(), m: new Date().getMonth() };

async function persist(){ try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }catch(e){ console.error("save failed",e); } }
async function load(){
  try{ const res = await window.storage.get(STORAGE_KEY,false); if(res && res.value) state = {...defaultState(), ...JSON.parse(res.value)}; }catch(e){}
  applyTheme(); render();
}
function applyTheme(){ document.documentElement.setAttribute("data-theme", state.darkMode?"dark":"light"); }

/* ======================= HELPERS ======================= */
function hexToRgb(hex){ hex=hex.replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); const n=parseInt(hex,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mixHex(a,b,ratio){ const A=hexToRgb(a),B=hexToRgb(b); return rgbToHex(A.map((v,i)=>v+(B[i]-v)*ratio)); }
const CARD_HEX_LIGHT = "#FBF7EC", CARD_HEX_DARK = "#212B27";
function subjectPastel(hex){ const base = state.darkMode ? CARD_HEX_DARK : CARD_HEX_LIGHT; return { bg: mixHex(base, hex, 0.30), border: mixHex(base, hex, 0.75) }; }
function fmtTime(hhmm){
  if(!hhmm) return "--:--";
  const [h,m] = hhmm.split(":").map(Number);
  if(state.timeFormat==="24") return `${pad(h)}:${pad(m)}`;
  const period = h<12 ? "ص":"م"; let h12=h%12; if(h12===0) h12=12;
  return `${h12}:${pad(m)} ${period}`;
}
function timeToMin(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }

function newChapter(name, order, pages, estMinutes){
  return { id:uid(), name, order, pages: pages?Number(pages):null, estMinutes: estMinutes?Number(estMinutes):null,
    tasks: DEFAULT_TASKS.map(l=>({id:uid(),label:l,done:false})), completedDate:null, reviews:[] };
}
function newSubject({name,emoji,color,creditHours,chapterName,chapterPages,chapterMinutes}){
  return { id:uid(), name, emoji: emoji||"📘", color: color||COLOR_PRESETS[0], creditHours: creditHours?Number(creditHours):null,
    chapters:[newChapter(chapterName||"Chapter 1",0,chapterPages,chapterMinutes)], tests:[] };
}
function chapterStatus(subject, chapter){
  if(chapter.completedDate) return "completed";
  const first = subject.chapters.find(c=>!c.completedDate);
  if(first && first.id===chapter.id) return "current";
  return "locked";
}
function reviewStatus(review){
  if(review.completed) return "completed";
  const t = todayStr();
  if(review.date===t) return "due";
  if(review.date<t) return "late";
  return "upcoming";
}
const STATUS_COLORS = {
  completed:{v:"--green",text:"#fff",label:"✅ مكتملة"}, current:{v:"--gold",text:"#2B2B26",label:"⭐ الحالية"},
  locked:{v:"--muted-icon",text:"#fff",label:"🔒 مقفلة"}, due:{v:"--gold",text:"#2B2B26",label:"🔥 مستحقة اليوم"},
  late:{v:"--red",text:"#fff",label:"⚠️ متأخرة"}, upcoming:{v:"--blue",text:"#fff",label:"🔵 قادمة"},
};
function pill(status){ const s=STATUS_COLORS[status]; return `<span class="pill" style="background:var(${s.v});color:${s.text}">${s.label}</span>`; }

function allChaptersFlat(){ const l=[]; state.subjects.forEach(s=>s.chapters.forEach(c=>l.push({subject:s,chapter:c,status:chapterStatus(s,c)}))); return l; }
function allReviewsFlat(){ const l=[]; state.subjects.forEach(s=>s.chapters.forEach(c=>c.reviews.forEach(r=>l.push({subject:s,chapter:c,review:r,status:reviewStatus(r)})))); return l; }
function allTestsFlat(){ const l=[]; state.subjects.forEach(s=>s.tests.forEach(t=>l.push({subject:s,test:t}))); return l.sort((a,b)=>a.test.date.localeCompare(b.test.date)); }
function chapterRangeLabel(subject, fromId, toId){
  if(!subject) return "";
  const f = subject.chapters.find(c=>c.id===fromId), t = subject.chapters.find(c=>c.id===toId);
  if(f && t && f.id!==t.id) return `${f.name} – ${t.name}`;
  return (f||t)?.name || "";
}
function generateReviewDates(startDateStr, mode, endDate){
  let last = 30;
  let dates = REVIEW_OFFSETS.map(o=>addDays(startDateStr,o));
  if(mode==="infinite"){
    for(let i=0;i<6;i++){ last*=2; dates.push(addDays(startDateStr,last)); }
  } else if(mode==="until" && endDate){
    dates = dates.filter(d=>d<=endDate);
    while(true){ last*=2; const d=addDays(startDateStr,last); if(d>endDate) break; dates.push(d); }
  }
  return dates;
}

function editChapterSubmit(subjectId, chapterId){

  const minutes = document.getElementById('f-ch-min').value;
  updateSubject(subjectId, s=>({...s, chapters: s.chapters.map(c=> c.id===chapterId ? {...c,name,pages:pages?Number(pages):null,estMinutes:minutes?Number(minutes):null} : c)}));

}
function deleteChapter(subjectId, chapterId){ updateSubject(subjectId, s=>({...s, chapters:s.chapters.filter(c=>c.id!==chapterId)})); }
function toggleTask(subjectId, chapterId, taskId){
  updateSubject(subjectId, s=>({...s, chapters: s.chapters.map(c=> c.id!==chapterId?c:{...c,tasks:c.tasks.map(t=>t.id===taskId?{...t,done:!t.done}:t)})}));
}
function openCompleteChapterModal(subjectId, chapterId){
  const body = `
  <p class="muted" style="font-size:12px;margin-bottom:12px">إلى متى تريد الاستمرار في مراجعة هذه المحطة بنظام التكرار المتباعد؟</p>
  <div class="row" style="gap:8px;margin-bottom:12px">
    <button id="opt-infinite" class="choice on" onclick="selectReviewMode('infinite')">🔁 مستمرة تلقائيًا</button>
    <button id="opt-until" class="choice" onclick="selectReviewMode('until')">📅 حتى تاريخ محدد</button>
  </div>
  <div id="until-date-wrap" style="display:none" class="field"><label>آخر تاريخ للمراجعة</label><input type="date" id="f-review-end" value="${addDays(todayStr(),60)}"></div>
  <button class="btn" style="width:100%;justify-content:center" onclick="confirmCompleteChapter('${subjectId}','${chapterId}')">🚀 إكمال المحطة!</button>
  `;
  openModal(modalWrap("🎉 إكمال المحطة", body));
  window.__reviewMode = "infinite";
}
function selectReviewMode(m){
  window.__reviewMode = m;
  document.getElementById('opt-infinite').className = "choice" + (m==="infinite"?" on":"");
  document.getElementById('opt-until').className = "choice" + (m==="until"?" on":"");
  document.getElementById('until-date-wrap').style.display = m==="until" ? "block" : "none";
}
function confirmCompleteChapter(subjectId, chapterId){
  const mode = window.__reviewMode || "infinite";
  const endDate = mode==="until" ? document.getElementById('f-review-end').value : null;
  const today = todayStr();
  updateSubject(subjectId, s=>({...s, chapters: s.chapters.map(c=> c.id!==chapterId?c:{...c, completedDate:today,
    reviews: generateReviewDates(today, mode, endDate).map(d=>({id:uid(),date:d,completed:false}))})}));
  closeModal();
}
function toggleReview(subjectId, chapterId, reviewId){
  updateSubject(subjectId, s=>({...s, chapters: s.chapters.map(c=> c.id!==chapterId?c:{...c, reviews:c.reviews.map(r=>r.id===reviewId?{...r,completed:!r.completed}:r)})}));
}

function saveTestSubmit(editingId){
  const subjectId = document.getElementById('f-test-subject').value;
  const name = document.getElementById('f-test-name').value.trim(); if(!name) return;
  const date = document.getElementById('f-test-date').value;
  const fromChapterId = document.getElementById('f-test-from').value;
  const toChapterId = document.getElementById('f-test-to').value;
  state.subjects = state.subjects.map(s=>({...s, tests: s.tests.filter(t=>t.id!==editingId)}));
  state.subjects = state.subjects.map(s=> s.id===subjectId ? {...s, tests:[...s.tests,{id:editingId||uid(),name,date,fromChapterId,toChapterId}]} : s);
  persist(); closeModal(); render();
}
function deleteTest(subjectId, testId){ updateSubject(subjectId, s=>({...s, tests:s.tests.filter(t=>t.id!==testId)})); closeModal(); }

function saveDayEntrySubmit(dateStr, editingId){
  const subjectId = document.getElementById('f-day-subject').value;
  const title = document.getElementById('f-day-title').value.trim(); if(!title) return;
  const description = document.getElementById('f-day-desc').value;
  const pages = document.getElementById('f-day-pages').value;
  const notes = document.getElementById('f-day-notes').value;
  const linkAsStation = document.getElementById('f-day-link').checked;

  let linkedChapterId = editingId ? undefined : null;
  if(linkAsStation && subjectId && title){
    const norm = title.toLowerCase();
    state.subjects = state.subjects.map(s=>{
      if(s.id!==subjectId) return s;
      const existing = s.chapters.find(c=>c.name.trim().toLowerCase()===norm);
      if(existing){ linkedChapterId = existing.id; return s; }
      const ch = newChapter(title, s.chapters.length);
      linkedChapterId = ch.id;
      return {...s, chapters:[...s.chapters, ch]};
    });
  }
  const day = state.weeklyLog[dateStr] || [];
  if(editingId){
    state.weeklyLog[dateStr] = day.map(e=> e.id===editingId ? {...e, subjectId,title,description,pages:pages?Number(pages):null,notes, linkedChapterId: linkedChapterId!==undefined?linkedChapterId:e.linkedChapterId} : e);
  } else {
    state.weeklyLog[dateStr] = [...day, {id:uid(),subjectId,title,description,pages:pages?Number(pages):null,notes,linkedChapterId}];
  }
  persist(); render();
  openDayModal(dateStr);
}
function deleteDayEntry(dateStr, entryId){ state.weeklyLog[dateStr] = (state.weeklyLog[dateStr]||[]).filter(e=>e.id!==entryId); persist(); render(); openDayModal(dateStr); }

function saveSlotSubmit(dayIdx, editingId){
  const subjectId = document.getElementById('f-slot-subject').value;
  const label = document.getElementById('f-slot-label').value.trim();
  const kind = document.getElementById('f-slot-kind').value;
  const start = document.getElementById('f-slot-start').value;
  const end = document.getElementById('f-slot-end').value;
  const day = state.timetable[dayIdx] || [];
  if(editingId) state.timetable[dayIdx] = day.map(s=> s.id===editingId ? {...s,subjectId,label,kind,start,end} : s);
  else state.timetable[dayIdx] = [...day, {id:uid(),subjectId,label,kind,start,end}];
  persist(); closeModal(); render();
}
function deleteSlot(dayIdx, slotId){ state.timetable[dayIdx] = (state.timetable[dayIdx]||[]).filter(s=>s.id!==slotId); persist(); closeModal(); render(); }

function addGpaCourse(){ state.gpaCourses.push({id:uid(), name:"مقرر", hours:3, grade:"A", semester:""}); persist(); render(); }
function updateGpaCourse(id, field, value){ state.gpaCourses = state.gpaCourses.map(c=> c.id===id ? {...c,[field]: field==='hours'?Number(value):value} : c); persist(); render(); }
function deleteGpaCourse(id){ state.gpaCourses = state.gpaCourses.filter(c=>c.id!==id); persist(); render(); }
function computeGpa(courses){ const h=courses.reduce((s,c)=>s+(Number(c.hours)||0),0); const p=courses.reduce((s,c)=>s+(GRADE_SCALE[c.grade]||0)*(Number(c.hours)||0),0); return h?p/h:0; }

function saveEventSubmit(){
  const date = document.getElementById('f-ev-date').value;

function toggleDark(){ state.darkMode = !state.darkMode; applyTheme(); persist(); render(); }
function setTimeFormat(f){ state.timeFormat = f; persist(); render(); }

  if(ui.view==="timetable") return timetableView();
  if(ui.view==="calendar") return calendarView();
  if(ui.view==="reviews") return reviewsView();
  if(ui.view==="plan") return planView();
  if(ui.view==="gpa") return gpaView();
  if(ui.view==="stats") return statsView();
  return "";
}

/* ======================= HOME ======================= */
function homeView(){
  if(state.subjects.length===0){
    return `<div class="card"><div class="empty"><div class="em">📚</div><div class="t">لا توجد مواد بعد</div><div class="s">أضف أول مادة وابدأ رحلتك بين المحطات! 🚉✨</div></div>
      <button class="btn" style="width:100%;justify-content:center;margin-top:8px" onclick="openAddSubjectModal()">➕ إضافة مادة الآن</button></div>`;
  }
  const chapters = allChaptersFlat();
  const total = chapters.length, done = chapters.filter(x=>x.status==="completed").length;
  const pct = total? Math.round(done/total*100):0;
  const hours = Math.round(chapters.filter(x=>x.status==="completed").reduce((s,x)=>s+(x.chapter.estMinutes||90),0)/60*10)/10;
  const tests = allTestsFlat().filter(x=>x.test.date>=todayStr()).sort((a,b)=>a.test.date.localeCompare(b.test.date));
  const nearest = tests[0]; const daysLeft = nearest? daysBetween(todayStr(),nearest.test.date):null;
  const current = chapters.filter(x=>x.status==="current");
  const dueReviews = allReviewsFlat().filter(x=>x.status==="due");

  return `
  <div class="card" style="background:var(--primary);color:#fff;border:none">
    <div class="row">
      <div><p style="opacity:.7;font-size:11px;margin:0">🔥 التقدم العام</p><p class="font-d" style="font-size:30px;font-weight:800;margin:2px 0">${pct}%</p><p style="opacity:.7;font-size:11px;margin:0">${done} / ${total} محطة مكتملة</p></div>
      <svg width="66" height="66" viewBox="0 0 66 66"><circle cx="33" cy="33" r="26" stroke="#ffffff33" stroke-width="7" fill="none"/><circle cx="33" cy="33" r="26" stroke="var(--gold)" stroke-width="7" fill="none" stroke-dasharray="${2*Math.PI*26}" stroke-dashoffset="${2*Math.PI*26 - pct/100*2*Math.PI*26}" stroke-linecap="round" transform="rotate(-90 33 33)"/></svg>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;text-align:center">
      <div style="flex:1;background:#ffffff1a;border-radius:16px;padding:8px"><p class="font-d" style="font-weight:800;margin:0">${total-done}</p><p style="font-size:9px;opacity:.7;margin:2px 0 0">🚉 متبقية</p></div>
      <div style="flex:1;background:#ffffff1a;border-radius:16px;padding:8px"><p class="font-d" style="font-weight:800;margin:0">${hours}</p><p style="font-size:9px;opacity:.7;margin:2px 0 0">⏱️ ساعة</p></div>
      <div style="flex:1;background:#ffffff1a;border-radius:16px;padding:8px"><p class="font-d" style="font-weight:800;margin:0">${daysLeft ?? "—"}</p><p style="font-size:9px;opacity:.7;margin:2px 0 0">⏳ للاختبار</p></div>
    </div>
  </div>

  <div class="section-title"><h2>📊 تقدم كل مادة</h2></div>
  <div class="grid">${state.subjects.map(s=>{
    const d=s.chapters.filter(c=>chapterStatus(s,c)==="completed").length, t=s.chapters.length, p=t?Math.round(d/t*100):0;
    const pastel = subjectPastel(s.color);
    return `<div class="card" style="cursor:pointer;border-right:5px solid ${pastel.border}" onclick="setView('subjects');openSubject('${s.id}')">
      <div class="row"><p style="margin:0;font-weight:700">${s.emoji} ${esc(s.name)}</p><p class="muted" style="margin:0;font-size:12px">${d}/${t} · ${p}%</p></div>
      <div class="bar" style="margin-top:8px"><i style="width:${p}%;background:var(--primary)"></i></div>
    </div>`;
  }).join("")}</div>

  <div class="section-title"><h2>🚉 محطة اليوم</h2></div>
  ${current.length===0 ? `<div class="card"><div class="empty"><div class="em">🚉</div><div class="t">لا توجد محطة نشطة الآن</div></div></div>` :
    `<div class="grid">${current.map(({subject,chapter})=>{
      const doneT = chapter.tasks.filter(t=>t.done).length;
      return `<div class="card" style="cursor:pointer" onclick="setView('subjects');openSubject('${subject.id}')">
        <div class="row"><div><p class="muted" style="margin:0;font-size:11px">${subject.emoji} ${esc(subject.name)}</p><p class="font-d" style="margin:2px 0 0;font-weight:800">${esc(chapter.name)}</p></div><div style="background:color-mix(in srgb, var(--gold) 20%, transparent);border-radius:50%;padding:8px">🚉</div></div>
        <div class="bar" style="margin-top:8px"><i style="width:${Math.round(doneT/chapter.tasks.length*100)}%;background:var(--gold)"></i></div>
        <p class="muted" style="font-size:11px;margin:6px 0 0">${doneT} / ${chapter.tasks.length} مهام منجزة</p>
      </div>`;
    }).join("")}</div>`}

  <div class="section-title"><h2>🔄 المراجعات المستحقة اليوم</h2></div>
  ${dueReviews.length===0 ? `<div class="card"><p class="muted" style="text-align:center;margin:6px 0">لا توجد مراجعات مستحقة اليوم 🎉</p></div>` :
    `<div class="card grid">${dueReviews.map(x=>`<div class="row" style="border-bottom:1px solid var(--track);padding-bottom:6px"><div><p class="muted" style="margin:0;font-size:11px">${x.subject.emoji} ${esc(x.subject.name)}</p><p style="margin:0;font-weight:700;font-size:13px">${esc(x.chapter.name)}</p></div>${pill('due')}</div>`).join("")}</div>`}

  ${nearest ? `<div class="section-title"><h2>🏁 أقرب اختبار</h2></div>
  <div class="card row"><div><p class="muted" style="margin:0;font-size:11px">${nearest.subject.emoji} ${esc(nearest.subject.name)}</p><p class="font-d" style="margin:2px 0;font-weight:800">${esc(nearest.test.name)}</p><p class="muted" style="margin:0;font-size:11px">${displayDate(nearest.test.date)}</p></div>
    <div style="background:var(--track);border-radius:16px;padding:8px 12px;text-align:center"><p class="font-d" style="font-weight:800;color:var(--red);margin:0;font-size:19px">${daysLeft}</p><p class="muted" style="margin:0;font-size:9px">يوم</p></div></div>` : ""}
  `;
}

    return `<div class="card" style="cursor:pointer;padding:0;overflow:hidden;border-right:6px solid ${pastel.border}" onclick="openSubject('${s.id}')">

function subjectDetailView(subjectId){
  const subject = state.subjects.find(s=>s.id===subjectId);
  if(!subject) return `<p>غير موجودة</p>`;
  return `
  <div class="row" style="margin-bottom:10px">
    <button onclick="backToSubjects()" style="color:var(--primary);font-weight:700;font-size:13px">‹ رجوع</button>
    <button onclick="openDeleteSubjectModal('${subjectId}')" style="color:var(--red)">🗑️</button>
  </div>

/* ======================= WEEKS (static) ======================= */
function weeksView(){
  const currentWeek = WEEKS.find(w=>todayStr()>=w.start && todayStr()<=w.end);
  const groups = [];
  WEEKS.forEach(w=>{ const label=`${gMonth(w.start)} ${gYear(w.start)}`; let g=groups.find(x=>x.label===label); if(!g){g={label,weeks:[]};groups.push(g);} g.weeks.push(w); });
  return groups.map(g=>`
    <p class="font-d" style="color:var(--primary);font-weight:800;font-size:13px;margin:14px 2px 8px">🗓️ ${g.label}</p>
    <div class="grid" style="gap:8px">
    ${g.weeks.map(w=>{
      const isCurrent = currentWeek && currentWeek.number===w.number;
      const isPast = todayStr()>w.end;
      const badge = isCurrent ? `<span class="pill" style="background:var(--gold);color:#2B2B26">⭐ الحالي</span>` : isPast ? `<span class="pill" style="background:var(--muted-icon);color:#fff">منتهٍ</span>` : `<span class="pill" style="background:var(--blue);color:#fff">قادم</span>`;
      const count = [0,1,2,3,4,5,6].reduce((s,i)=>s+((state.weeklyLog[addDays(w.start,i)]||[]).length),0);
      return `<button class="week-card" onclick="openWeek(${w.number})">
        <div class="card ${isCurrent?'hl':''}">
          <div class="row"><p style="margin:0;font-weight:700;font-size:13px">الأسبوع ${w.ordinal}</p>${badge}</div>
          <p class="muted" style="font-size:11px;margin:6px 0 0">${formatRange(w.start,w.end)}</p>
          <p class="muted-i" style="font-size:10px;margin:2px 0 0">${w.hijri}</p>
          ${count>0?`<p style="color:var(--green);font-size:10px;font-weight:800;margin:8px 0 0">✍️ ${count} سجلات</p>`:""}

/* ======================= TIMETABLE (image-style grid, Sun–Thu, lecture kind) ======================= */
const TT_START=7, TT_END=22, ROW_H=48;
const TT_DAYS = [0,1,2,3,4]; // Sunday .. Thursday only
function timetableView(){
  if(state.subjects.length===0) return `<div class="card"><div class="empty"><div class="em">📘</div><div class="t">أضف مادة أولًا</div><div class="s">لتتمكن من بناء جدولك الدراسي.</div></div></div>`;
  const totalH = (TT_END-TT_START)*ROW_H;
  let hourRows = "";
  for(let h=TT_START; h<TT_END; h++){ hourRows += `<div class="tt-hourline tt-timelabel" style="top:${(h-TT_START)*ROW_H}px;height:${ROW_H}px">${pad(h)}:00 - ${pad(h+1)}:00</div>`; }
  let cols = "";
  TT_DAYS.forEach((d,ci)=>{
    const slots = (state.timetable[d]||[]).slice().sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    let lines = "";
    for(let h=TT_START; h<=TT_END; h++){ lines += `<div class="tt-hourline" style="top:${(h-TT_START)*ROW_H}px"></div>`; }
    let blocks = slots.map(s=>{
      const subj = state.subjects.find(x=>x.id===s.subjectId); if(!subj) return "";
      const pastel = subjectPastel(subj.color);
      const top = Math.max(0,(timeToMin(s.start||"08:00") - TT_START*60)/60*ROW_H);
      const height = Math.max(((timeToMin(s.end||"09:00")-timeToMin(s.start||"08:00"))/60)*ROW_H - 3, 26);
      const kindTag = s.kind==="عملي" ? "🧪 عملي" : "📖 نظري";
      return `<button class="tt-block" onclick="openSlotForm(${d},'${s.id}')" style="top:${top}px;height:${height}px;background:${pastel.bg};border-color:${pastel.border};color:var(--text)">
        <b>${esc(subj.name)}</b><span>${fmtTime(s.start)}-${fmtTime(s.end)}</span><span>${kindTag}</span></button>`;
    }).join("");
    cols += `<div class="tt-col ${ci%2===0?'zebra':''}" style="height:${totalH}px">${lines}${blocks}</div>`;
  });
  return `
  <div class="tt-wrap"><div class="tt-grid" style="grid-template-columns:64px repeat(5,1fr)">
    <div class="tt-head"></div>
    ${TT_DAYS.map(d=>`<div class="tt-head">${WEEKDAYS_AR[d]}</div>`).join("")}
    <div style="position:relative;height:${totalH}px">${hourRows}</div>
    ${cols}
  </div></div>
  <div class="tt-addrow">${TT_DAYS.map(d=>`<button class="tt-addbtn" onclick="openSlotForm(${d},null)">➕ ${WEEKDAYS_AR[d]}</button>`).join("")}</div>
  `;
}
function openSlotForm(dayIdx, slotId){
  const slot = slotId ? (state.timetable[dayIdx]||[]).find(s=>s.id===slotId) : null;
  const body = `
  <div class="field"><label>المادة</label><select id="f-slot-subject">${state.subjects.map(s=>`<option value="${s.id}" ${slot?.subjectId===s.id?"selected":""}>${s.emoji} ${esc(s.name)}</option>`).join("")}</select></div>
  <div class="field"><label>نوع المحاضرة</label><select id="f-slot-kind"><option value="نظري" ${slot?.kind!=="عملي"?"selected":""}>📖 نظري</option><option value="عملي" ${slot?.kind==="عملي"?"selected":""}>🧪 عملي</option></select></div>
  <div class="two-col">
    <div class="field"><label>من الساعة</label><input id="f-slot-start" type="time" value="${slot?.start||"08:00"}"></div>
    <div class="field"><label>إلى الساعة</label><input id="f-slot-end" type="time" value="${slot?.end||"09:00"}"></div>
  </div>
  <div class="field"><label>ملاحظة (اختياري)</label><input id="f-slot-label" value="${esc(slot?.label||"")}" placeholder="مثال: قاعة 204"></div>
  <div class="row" style="gap:8px">
    <button class="btn" style="flex:1;justify-content:center" onclick="saveSlotSubmit(${dayIdx}${slotId?`,'${slotId}'`:',null'})">💾 حفظ</button>
    ${slotId?`<button class="btn danger" onclick="deleteSlot(${dayIdx},'${slotId}')">🗑️</button>`:""}

}

/* ======================= CALENDAR (month + list, custom events, test linking) ======================= */
function calendarView(){
  const seg = `<div class="section-title">
    <div class="seg" style="max-width:220px"><button class="${ui.calMode==='month'?'on':''}" onclick="setCalMode('month')">📅 شهري</button><button class="${ui.calMode==='list'?'on':''}" onclick="setCalMode('list')">📋 قائمة</button></div>
    <button class="btn sm" onclick="openAddEventModal()">➕ إضافة حدث</button>
  </div>`;
  return seg + (ui.calMode==="list" ? calendarListView() : calendarMonthView());
}
function calendarMonthView(){
  const monthLabel = `${MONTHS_AR[calCursor.m]} ${calCursor.y}`;
  const firstDow = new Date(calCursor.y, calCursor.m, 1).getDay();
  const daysInMonth = new Date(calCursor.y, calCursor.m+1, 0).getDate();
  const cells = [...Array(firstDow).fill(null), ...Array.from({length:daysInMonth},(_,i)=>`${calCursor.y}-${pad(calCursor.m+1)}-${pad(i+1)}`)];
  return `
  <div class="card">
    <div class="cal-head"><button onclick="calPrev()" style="color:var(--primary);font-size:16px">›</button><p class="font-d" style="font-weight:800;margin:0;font-size:14px">${monthLabel}</p><button onclick="calNext()" style="color:var(--primary);font-size:16px">‹</button></div>
    <div class="cal-grid" style="margin-bottom:4px">${WEEKDAYS_AR.map(d=>`<div class="cal-dow">${d.slice(0,3)}</div>`).join("")}</div>
    <div class="cal-grid">${cells.map(dateStr=>{
      if(!dateStr) return `<div></div>`;
      const evs = dayEvents(dateStr);
      const cats = [...new Set(evs.map(e=>e.type))].slice(0,4);
      const isToday = dateStr===todayStr();
      return `<button class="cal-cell ${isToday?'today':''}" onclick="openDayEventsModal('${dateStr}')"><span>${gDay(dateStr)}</span><div class="cal-dots">${cats.map(c=>`<i style="background:var(${EVENT_COLORS[c].v})"></i>`).join("")}</div></button>`;
    }).join("")}</div>
  </div>`;
}
function calendarListView(){
  const from = addDays(todayStr(),-7), to = addDays(todayStr(),60);
  const map = {};
  let d = from;
  while(d<=to){ const evs = dayEvents(d); if(evs.length) map[d]=evs; d = addDays(d,1); }
  const dates = Object.keys(map).sort();
  if(dates.length===0) return `<div class="card"><div class="empty"><div class="em">📋</div><div class="t">لا توجد أحداث قريبة</div></div></div>`;
  return `<div class="grid">${dates.map(dt=>`<div class="card"><p style="color:var(--primary);font-weight:800;font-size:12px;margin:0 0 8px">${displayDate(dt)}</p>
    ${map[dt].map(e=>`<div class="row" style="justify-content:flex-start;gap:8px;margin-bottom:5px"><span style="width:8px;height:8px;border-radius:50%;background:var(${EVENT_COLORS[e.type].v});flex-shrink:0"></span><span style="font-size:13px">${esc(e.label)}</span></div>`).join("")}
    </div>`).join("")}</div>`;
}
function calPrev(){ calCursor = calCursor.m===0?{y:calCursor.y-1,m:11}:{y:calCursor.y,m:calCursor.m-1}; render(); }
function calNext(){ calCursor = calCursor.m===11?{y:calCursor.y+1,m:0}:{y:calCursor.y,m:calCursor.m+1}; render(); }
function dayEvents(dateStr){
  const evs = [];
  KEY_DATES.forEach(kd=>{ if(dateStr>=kd.start && dateStr<=kd.end) evs.push({type:kd.type,label:`${kd.emoji} ${kd.title}`}); });
  allTestsFlat().forEach(x=>{ if(x.test.date===dateStr) evs.push({type:"test",label:`🏁 ${x.test.name} — ${x.subject.name}`, testId:x.test.id, subjectId:x.subject.id}); });
  (state.weeklyLog[dateStr]||[]).forEach(e=>{ const subj=state.subjects.find(s=>s.id===e.subjectId); evs.push({type:"lecture",label:`📘 ${e.title} — ${subj?.name||""}`}); });
  allReviewsFlat().forEach(x=>{ if(x.review.date===dateStr) evs.push({type:"reminder",label:`🔔 مراجعة ${x.chapter.name} — ${x.subject.name}`}); });
  state.customEvents.forEach(e=>{ if(e.date===dateStr) evs.push({type:e.type,label:`${EVENT_COLORS[e.type].label.split(" ")[0]} ${e.title}`, customId:e.id}); });
  return evs;
}
function openDayEventsModal(dateStr){
  const evs = dayEvents(dateStr);
  const body = `
  ${evs.length===0 ? `<p class="muted-i" style="text-align:center;padding:14px 0">لا توجد أحداث هذا اليوم</p>` :
    `<div class="grid" style="margin-bottom:12px">${evs.map(e=>`<div class="row" style="background:var(--track);border-radius:12px;padding:10px">
      <span style="width:8px;height:8px;border-radius:50%;background:var(${EVENT_COLORS[e.type].v});flex-shrink:0"></span>
      <span style="flex:1;font-size:13px">${esc(e.label)}</span>
      ${e.testId?`<button onclick="openTestForm('${e.testId}')" style="color:var(--blue)">✏️</button>`:""}
      ${e.customId?`<button onclick="deleteCustomEvent('${e.customId}');openDayEventsModal('${dateStr}')" style="color:var(--red)">🗑️</button>`:""}
    </div>`).join("")}</div>`}
  <button class="btn outline" style="width:100%;justify-content:center" onclick="openAddEventModal('${dateStr}')">➕ إضافة حدث لهذا اليوم</button>
  `;
  openModal(modalWrap(displayDate(dateStr), body));

/* ======================= REVIEWS (simpler & clearer) ======================= */
function reviewsView(){
  const all = allReviewsFlat();
  const late = all.filter(x=>x.status==="late"), due = all.filter(x=>x.status==="due");
  const upcoming = all.filter(x=>x.status==="upcoming").sort((a,b)=>a.review.date.localeCompare(b.review.date)).slice(0,15);
  const completed = all.filter(x=>x.status==="completed");
  const totalActive = late.length+due.length+upcoming.length+completed.length;

  const row = (x)=>`<div class="row" style="background:var(--track);border-radius:14px;padding:10px 12px">
    <button onclick="toggleReview('${x.subject.id}','${x.chapter.id}','${x.review.id}')" class="rev-check ${x.status==='completed'?'done':''}">${x.status==='completed'?"✔":""}</button>
    <div style="flex:1;min-width:0">
      <p style="margin:0;font-weight:700;font-size:13px;${x.status==='completed'?'text-decoration:line-through;color:var(--muted-icon)':''}">${esc(x.chapter.name)}</p>
      <p class="muted" style="margin:2px 0 0;font-size:11px">${x.subject.emoji} ${esc(x.subject.name)} · ${displayDate(x.review.date)}</p>
    </div>
    ${pill(x.status)}
  </div>`;

  return `
  <div class="card" style="background:var(--primary);color:#fff;text-align:center;padding:16px;margin-bottom:14px">
    <p style="opacity:.7;font-size:11px;margin:0">✅ مكتملة من إجمالي المراجعات النشطة</p>

  `;

function renderSmartPlanBody(){
  const el = document.getElementById('smart-plan-body'); if(!el) return;
  const val = document.getElementById('f-plan-test').value;
  const [subjectId, testId] = val.split(":");
  const subject = state.subjects.find(s=>s.id===subjectId);
  const test = subject.tests.find(t=>t.id===testId);
  const today = todayStr();
  const days = Math.max(daysBetween(today, test.date), 1);
  const remaining = subject.chapters.filter(c=>chapterStatus(subject,c)!=="completed");
  const dayMap = {};
  remaining.forEach((c,i)=>{
    const idx = remaining.length>1 ? Math.round((i*(days-1)*0.7)/(remaining.length-1)) : 0;
    const date = addDays(today, Math.min(idx, days-1));
    (dayMap[date]=dayMap[date]||[]).push({type:"station",label:`🚉 ${c.name}`});
  });
  allReviewsFlat().filter(x=>x.subject.id===subjectId && x.status!=="completed").forEach(x=>{
    const diff = daysBetween(today, x.review.date);
    if(diff>=0 && diff<=days){ (dayMap[x.review.date]=dayMap[x.review.date]||[]).push({type:"reminder",label:`🔄 مراجعة ${x.chapter.name}`}); }
  });
  for(let i=0;i<days;i++){
    const date = addDays(today,i);
    const has = dayMap[date] && dayMap[date].length>0;
    const final = i>=days-2;
    if(!has && (i%3===2 || final)){ (dayMap[date]=dayMap[date]||[]).push({type:"task",label: final?"📝 مراجعة نهائية وحل أسئلة":"🧠 حل أسئلة وتثبيت"}); }
  }
  const dates = Object.keys(dayMap).sort();
  el.innerHTML = (remaining.length===0 && dates.length===0)
    ? `<p style="color:var(--green);font-weight:700;text-align:center;padding:14px 0">كل المحطات مكتملة 🎉</p>`
    : `<div style="max-height:45vh;overflow-y:auto" class="grid">${dates.map(d=>`<div style="background:var(--track);border-radius:12px;padding:8px 10px">
        <p style="color:var(--primary);font-weight:800;font-size:11px;margin:0 0 4px">${displayDate(d)}</p>
        ${dayMap[d].map(e=>`<p style="font-size:12px;margin:2px 0">${esc(e.label)}</p>`).join("")}</div>`).join("")}</div>`;
}

/* ======================= STATS ======================= */
function statsView(){
  if(state.subjects.length===0) return `<div class="card"><div class="empty"><div class="em">📊</div><div class="t">لا توجد إحصائيات بعد</div><div class="s">أضف مواد وأكمل محطات لترى تقدمك هنا.</div></div></div>`;
  const chapters = allChaptersFlat(); const total=chapters.length, done=chapters.filter(x=>x.status==="completed").length;
  const pct = total?Math.round(done/total*100):0;
  const reviews = allReviewsFlat();
  const completedR = reviews.filter(x=>x.status==="completed").length, upcomingR = reviews.filter(x=>x.status==="upcoming"||x.status==="due").length, lateR = reviews.filter(x=>x.status==="late").length;
  const hours = Math.round(chapters.filter(x=>x.status==="completed").reduce((s,x)=>s+(x.chapter.estMinutes||90),0)/60*10)/10;
  return `
  <div class="card" style="background:var(--primary);color:#fff;text-align:center;padding:22px">
    <p style="opacity:.7;font-size:11px;margin:0">${pct===100?"🏆 اكتمل كل شيء!":"🔥 التقدم العام"}</p>
    <p class="font-d" style="font-size:34px;font-weight:800;margin:4px 0">${pct}%</p>

  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">
    <div class="card" style="text-align:center;padding:12px"><p class="font-d" style="font-weight:800;color:var(--green);margin:0;font-size:18px">${completedR}</p><p class="muted" style="font-size:10px;margin:4px 0 0">مكتملة ✅</p></div>
    <div class="card" style="text-align:center;padding:12px"><p class="font-d" style="font-weight:800;color:var(--blue);margin:0;font-size:18px">${upcomingR}</p><p class="muted" style="font-size:10px;margin:4px 0 0">قادمة 🔵</p></div>
    <div class="card" style="text-align:center;padding:12px"><p class="font-d" style="font-weight:800;color:var(--red);margin:0;font-size:18px">${lateR}</p><p class="muted" style="font-size:10px;margin:4px 0 0">متأخرة ⚠️</p></div>
  </div>
  <div class="section-title"><h2>🏆 الإنجاز لكل مادة</h2></div>
  <div class="grid">${state.subjects.map(s=>{ const d=s.chapters.filter(c=>chapterStatus(s,c)==="completed").length, t=s.chapters.length, p=t?Math.round(d/t*100):0;
    return `<div class="card"><div class="row"><p style="margin:0;font-weight:700;font-size:13px">${s.emoji} ${esc(s.name)}</p><p class="muted" style="margin:0;font-size:11px">${d}/${t}</p></div><div class="bar" style="margin-top:8px"><i style="width:${p}%;background:var(--primary)"></i></div></div>`;
  }).join("")}</div>
  `;
}

  </div>
  <div style="background:var(--track);border-radius:14px;padding:12px;margin-bottom:12px">
    <p style="font-size:13px;font-weight:700;margin:0 0 8px">🎨 دليل الألوان</p>
    <div style="display:flex;flex-direction:column;gap:6px">
    ${legendKeys.map(k=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(${EVENT_COLORS[k].v})"></span>${EVENT_COLORS[k].label}</div>`).join("")}
    </div>
  </div>
  <p class="muted" style="font-size:11px;margin-bottom:10px">جميع بياناتك محفوظة تلقائيًا على هذا الجهاز والمتصفح.</p>
  <button class="btn danger" style="width:100%;justify-content:center" onclick="openResetConfirm()">🗑️ إعادة تعيين جميع البيانات</button>
  `;
  openModal(modalWrap("⚙️ الإعدادات", body));
}
function openResetConfirm(){
  const body = `<p style="color:var(--red);font-weight:700;font-size:13px;margin-bottom:12px">سيتم حذف كل شيء نهائيًا. هل أنت متأكد؟</p>
  <div class="row" style="gap:8px"><button class="btn ghost" style="flex:1;justify-content:center" onclick="openSettingsModal()">إلغاء</button><button class="btn danger" style="flex:1;justify-content:center" onclick="resetAll()">تأكيد الحذف</button></div>`;
  openModal(modalWrap("⚠️ تأكيد", body));
}

/* ======================= INIT ======================= */
load();
</script>
</body>
</html>
